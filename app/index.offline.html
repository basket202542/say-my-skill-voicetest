<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Say My Skill!</title>
<!-- shown by the service worker when the first open has no network (web export preset "WebApp") -->
<style>
html, body { margin: 0; height: 100%; background: #fff6e8; color: #7a5f6e;
  font-family: system-ui, -apple-system, "Noto Sans Thai", sans-serif; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
img { width: 180px; height: 180px; opacity: 0.85; }
p { margin: 6px 24px; font-size: 15px; }
.en { opacity: 0.7; font-size: 13px; }
button { margin-top: 18px; width: 56px; height: 56px; border-radius: 50%; border: 0;
  background: #ffffffcc; box-shadow: 0 2px 6px rgba(122, 95, 110, 0.18); }
</style>
</head>
<body>
<img src="app.book.png" alt="">
<p>ต่อเน็ตก่อนนะ แล้วแตะเพื่อลองใหม่</p>
<p class="en">Connect to the internet, then tap to try again.</p>
<button type="button" aria-label="ลองใหม่ / Retry">
  <svg viewBox="0 0 26 26" width="28" height="28" aria-hidden="true"><path d="M19.5 9.5 A8 8 0 1 0 21 14" fill="none" stroke="#8a6a7c" stroke-width="2.6" stroke-linecap="round"/><path d="M20.5 4.5 L20.5 10 L15 10" fill="none" stroke="#8a6a7c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<script>document.querySelector('button').addEventListener('click', () => location.replace('index.html'));</script>
</body>
</html>
